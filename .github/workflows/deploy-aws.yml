name: Deploy ECS

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      deployment-environment:
        required: true
        type: string

jobs:
  deploy-to-ecs:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.deployment-environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Read deployment configuration
        id: config
        shell: bash
        run: |
          environment="${{ inputs.deployment-environment }}"
          [[ "$environment" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || {
            echo "Invalid deployment environment: $environment" >&2
            exit 1
          }
          config=".github/deployments/$environment.env"
          read_value() {
            local key="$1" value
            value="$(awk -v key="$key" '
              $0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
                sub("^[[:space:]]*" key "[[:space:]]*=[[:space:]]*", "")
                sub(/^"/, "")
                sub(/"[[:space:]]*$/, "")
                print
              }
            ' "$config")"
            [[ -n "$value" && "$value" != *$'\n'* ]] || {
              echo "Missing or duplicate $key in $config" >&2
              exit 1
            }
            printf '%s' "$value"
          }

          aws_region="$(read_value aws_region)"
          role_to_assume="$(read_value github_deploy_role_arn)"
          cluster="$(read_value ecs_cluster_name)"
          service="$(read_value ecs_service_name)"
          task_family="$(read_value ecs_task_family)"

          [[ "$aws_region" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]] || { echo "Invalid aws_region in $config" >&2; exit 1; }
          [[ "$role_to_assume" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]] || { echo "Invalid github_deploy_role_arn in $config" >&2; exit 1; }
          [[ -n "$cluster" && -n "$service" && -n "$task_family" ]] || { echo "ECS deployment values cannot be empty" >&2; exit 1; }

          echo "aws-region=$aws_region" >> "$GITHUB_OUTPUT"
          echo "role-to-assume=$role_to_assume" >> "$GITHUB_OUTPUT"
          echo "cluster=$cluster" >> "$GITHUB_OUTPUT"
          echo "service=$service" >> "$GITHUB_OUTPUT"
          echo "task-family=$task_family" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.role-to-assume }}
          aws-region: ${{ steps.config.outputs.aws-region }}

      - name: Download active task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ steps.config.outputs.task-family }}" \
            --query taskDefinition \
            --output json > task-definition.json

      - name: Clean task definition
        run: |
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' task-definition.json > clean.json

      - name: Get container name
        id: container
        run: |
          echo "name=$(jq -r '.containerDefinitions[0].name' clean.json)" >> $GITHUB_OUTPUT

      - name: Render new task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: clean.json
          container-name: ${{ steps.container.outputs.name }}
          image: ${{ inputs.image }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ steps.config.outputs.service }}
          cluster: ${{ steps.config.outputs.cluster }}
          wait-for-service-stability: true

name: CD - Promote and Deploy

run-name: Promote ${{ github.sha }} from dev to production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: main-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  image-config:
    name: Read dev image configuration
    runs-on: ubuntu-latest
    outputs:
      dockerhub-username: ${{ steps.config.outputs.dockerhub-username }}
    steps:
      - uses: actions/checkout@v4

      - name: Read dev image configuration
        id: config
        shell: bash
        run: |
          config=.github/deployments/dev.env
          read_value() {
            local key="$1" value
            value="$(awk -v key="$key" '
              $0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
                sub("^[[:space:]]*" key "[[:space:]]*=[[:space:]]*", "")
                sub(/^"/, "")
                sub(/"[[:space:]]*$/, "")
                print
              }
            ' "$config")"
            [[ -n "$value" && "$value" != *$'\n'* ]] || {
              echo "Missing or duplicate $key in $config" >&2
              exit 1
            }
            printf '%s' "$value"
          }

          dockerhub_username="$(read_value dockerhub_username)"
          [[ "$dockerhub_username" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || {
            echo "Invalid dockerhub_username in $config" >&2
            exit 1
          }
          echo "dockerhub-username=$dockerhub_username" >> "$GITHUB_OUTPUT"

  static-analysis:
    uses: ./.github/workflows/static-analysis.yml
    with:
      publish-pages: true
    secrets: inherit

  build-and-scan-image:
    needs: [image-config, static-analysis]
    uses: ./.github/workflows/build-and-push.yml
    with:
      image-tag: ${{ github.sha }}
      dockerhub-username: ${{ needs.image-config.outputs.dockerhub-username }}
      publish-image: true
      publish-latest: true
      run-trivy: true
    secrets: inherit

  deploy-dev:
    needs: [image-config, build-and-scan-image]
    uses: ./.github/workflows/deploy-aws.yml
    with:
      image: ${{ needs.image-config.outputs.dockerhub-username }}/${{ needs.build-and-scan-image.outputs.image-name }}:${{ github.sha }}
      deployment-environment: dev

  deploy-int:
    needs: [image-config, build-and-scan-image, deploy-dev]
    uses: ./.github/workflows/deploy-aws.yml
    with:
      image: ${{ needs.image-config.outputs.dockerhub-username }}/${{ needs.build-and-scan-image.outputs.image-name }}:${{ github.sha }}
      deployment-environment: int

  deploy-production:
    needs: [image-config, build-and-scan-image, deploy-int]
    uses: ./.github/workflows/deploy-aws.yml
    with:
      image: ${{ needs.image-config.outputs.dockerhub-username }}/${{ needs.build-and-scan-image.outputs.image-name }}:${{ github.sha }}
      deployment-environment: production
